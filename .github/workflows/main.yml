name: Build C++ EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "main.cpp"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C++ to EXE
        shell: cmd
        run: g++ -std=c++17 main.cpp -o program.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: program-exe
          path: program.exe
