name: Run C++ and Export Excel

on:
  workflow_dispatch:
  push:
    paths:
      - "main.cpp"
      - "data/**"
      - ".github/workflows/cpp-to-excel.yml"

jobs:
  run-cpp-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
          pip install openpyxl

      - name: Compile C++ program
        run: g++ -std=c++17 main.cpp -o program

      - name: Run C++ program
        run: |
          mkdir -p output
          ./program | tee output/hasil.txt

      - name: Convert output to Excel
        run: python scripts/to_excel.py

      - name: Upload Excel file
        uses: actions/upload-artifact@v4
        with:
          name: hasil-program-cpp-excel
          path: output/hasil.xlsx
